name: Website CI

# PR-level validation for the docs site. docs.yml only builds on push to
# main (deploy), so without this job website/** changes — including
# dependabot bumps to astro/sharp — would merge with zero validation.
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro requires >=22.23.4; "22" can resolve to an older version cached on the runner.
          node-version: 22.23.4
          cache: pnpm
          # The website is its own pnpm workspace with a separate lockfile.
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
