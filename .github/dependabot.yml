version: 2

# Cooldown mirrors the pnpm `minimumReleaseAge` guard (3 days): Dependabot
# resolves versions itself and would otherwise bypass it. Majors wait a week.
# Cooldown applies to VERSION updates only — SECURITY updates land immediately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # TypeScript 7 breaks `pnpm build`: tsup 8.5.1 bundles a rollup-plugin-dts
      # that is not TS7-compatible (egoist/tsup#1405, fix #1409 unreleased).
      # lint/typecheck/test pass on TS7 — only the d.ts emit fails. Drop this
      # once tsup ships the fix; adopting TS7 also deserves its own ADR.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      types:
        patterns:
          - "@types/*"
      build:
        patterns:
          - tsup
          - typescript
          - vitest
          - oxlint
          - tsx
      mdast:
        patterns:
          - mdast-util-*
          - "@types/mdast"
  # The docs site keeps its own lockfile — without this entry its Astro/
  # Starlight dependencies would never receive update PRs.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # init and analyze must run the same version: the analyze post-step
      # rejects a config file written by a different version, so separate
      # PRs for the two can never pass CI (#106 / #107).
      codeql:
        patterns:
          - github/codeql-action/*
