version: 2

# Cooldown: npm waits 3 days, matching pnpm `minimumReleaseAge`, and 7 for majors.
# github-actions waits 7 days for every update: that ecosystem rejects
# `semver-*-days`, and an invalid key makes Dependabot report this whole file as
# invalid (#50 until this fix), so its later changes did not reach update jobs.
# After editing, check the `.github/dependabot.yml` check run on the main commit;
# it does not appear on PRs.
# Cooldown applies to VERSION updates only — SECURITY updates land immediately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # TypeScript 7 breaks `pnpm build`: tsup 8.5.1 bundles a rollup-plugin-dts
      # that is not TS7-compatible (egoist/tsup#1405, fix #1409 unreleased).
      # lint/typecheck/test pass on TS7 — only the d.ts emit fails. Drop this
      # once tsup ships the fix; adopting TS7 also deserves its own ADR.
      # `versions` rather than `update-types`: inside a group Dependabot does
      # not honour update-types ignores (dependabot-core#10122) — verified on
      # #103, which kept TS 7 after two recreates with the update-types form.
      # NOTE: this file was invalid when both forms were tried, so that test said
      # nothing about either form. A second rule is stored on GitHub's side by
      # `@dependabot ignore typescript major version` (#103, 2026-09-02).
      # To re-enable TS 7 you must do BOTH: delete this entry AND comment
      # `@dependabot unignore typescript` on any open Dependabot PR.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      types:
        patterns:
          - "@types/*"
      build:
        patterns:
          - tsup
          - typescript
          - vitest
          - oxlint
          - tsx
      mdast:
        patterns:
          - mdast-util-*
          - "@types/mdast"
  # The docs site keeps its own lockfile — without this entry its Astro/
  # Starlight dependencies would never receive update PRs.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # init and analyze must run the same version: the analyze post-step
    # rejects a config file written by a different version, so separate
    # PRs for the two can never pass CI (#106 / #107).
    # This group has not fired yet: every job so far ran while this file was
    # invalid, so `"dependency-groups":[]` in those logs (#186 / #187) says
    # nothing about the patterns. If the next version job still splits the PRs,
    # bump both pins in one hand-made PR that supersedes Dependabot's (#194).
    groups:
      codeql:
        applies-to: version-updates
        patterns:
          - github/codeql-action/init
          - github/codeql-action/analyze
